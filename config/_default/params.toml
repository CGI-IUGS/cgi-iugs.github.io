# Settings used by the site theme (themes/cgi).

# Default description for search engines and link previews.
description = "Resources about data sharing, standards, and best practice in geoscience information management."

# Images in assets/: the header logo and the square icon used for the favicon.
logo = "images/logo.png"
icon = "images/icon.png"

# Twitter/X account, without the @, for link previews.
twitter = "CGI_IUGS"

# Date formats (Go layout: https://gohugo.io/functions/time/format/).
date_format = "Jan 2, 2006"
publication_date_format = "January 2006"

# "Edit this page on GitHub" links.
[edit_page]
  repo_url = "https://github.com/CGI-IUGS/cgi-iugs.github.io"
  branch = "main"
