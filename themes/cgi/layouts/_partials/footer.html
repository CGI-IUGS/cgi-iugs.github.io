<footer class="site-footer">
  <div class="wrap">
    {{- with site.Copyright }}
    <p>{{ replace . "{year}" (string now.Year) | safeHTML }}</p>
    {{- end }}
    <ul>
      {{- with site.Home.OutputFormats.Get "rss" }}
      <li><a href="{{ .RelPermalink }}">RSS feed</a></li>
      {{- end }}
      {{- with site.Params.edit_page.repo_url }}
      <li><a href="{{ . }}">Website source on GitHub</a></li>
      {{- end }}
    </ul>
  </div>
</footer>
